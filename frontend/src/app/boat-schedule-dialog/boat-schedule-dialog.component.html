
<div class="schedule-dialog">
  <div class="schedule-dialog__header">
    <div>
      <h1 class="schedule-dialog__title">Horaires des bateaux</h1>
      <p  class="schedule-dialog__title-date">{{ tripResearchService.getSearch().date | date:'EEEE d MMMM y' }}</p>
    </div>
    <span mat-dialog-close class="schedule-dialog__header-close material-symbols-outlined">close</span>
  </div>

  <mat-dialog-content class="mat-typography schedule-dialog__content">
    @for(section of sections; track section){
      <div class="schedule-dialog__schedule-items">
        <app-trip-proposal-section [section]="section"></app-trip-proposal-section>
      </div>
    }
  </mat-dialog-content>
</div>
