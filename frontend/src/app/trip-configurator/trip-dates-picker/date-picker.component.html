<mat-form-field class="date-picker__input">
  <mat-label>Choisissez une date</mat-label>
  <input matInput
  [min]="minDate" [max]="maxDate"
  [matDatepicker]="datepicker" [(ngModel)]="dateSelected" (ngModelChange)="onDateOrTimeChange()">
  <mat-datepicker touchUi #datepicker/>
  <mat-datepicker-toggle [for]="datepicker" matSuffix/>
</mat-form-field>
