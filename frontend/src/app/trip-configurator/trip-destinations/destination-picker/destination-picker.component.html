<div class="places-autocomplete">
  <input
    class="places-autocomplete__input"
    type="text"
    [readonly]="isReadOnly"
    [value]="valueText"
    [placeholder]="placeholderText"
    [disabled]="isDisabled"
    (input)="autoComplete($event)">

  <div class="places-autocomplete__results">
    @for (proposal of autoCompleteResults() ; track $index) {
      <button class="places-autocomplete__result-item" (click)="selectLocation($event)">
        {{proposal.name}}
      </button>
    }
  </div>

</div>
