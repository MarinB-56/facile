<div class="trip-configurator">
  <div class="trip-configurator__wrapper">
    <app-trip-destinations-form
      [arrival]="arrival()"
      [departure]="departure()"
      (departureSelectedEvent)="onDepartureSelected($event)"
      (arrivalSelectedEvent)="onArrivalSelected($event)"
      (swappDestinationEvent)="onDestinationsSwapped()">
    </app-trip-destinations-form>
  </div>

  <app-trip-date-picker (dateChangeEvent)="onDateSelected($event)"></app-trip-date-picker>
  <!-- <p>Value: {{tripDate()}}</p> -->

  <app-trip-search-button [isDisabled]="!isTripValid()" (click)="onSearch()"></app-trip-search-button>

  <a routerLink="/essai">Voir les produits</a>

</div>
